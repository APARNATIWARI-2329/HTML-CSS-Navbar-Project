<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EXERCISE 7</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap');

        body {
            background-color:rgb(0, 0, 0);
            color: wheat;

        }

        header {
            font-family: "DM Serif Display", serif;
            font-weight: 400;
            font-style: normal;
            
        }

        h1 {
            display: inline-flex;
        }

        .logo img {
            width: 130px;
            margin: 5px;
        }

        nav {
            
            display: flex;
            justify-content: space-around;
            align-items: center;
            /*if one row then align items , if multiple rows then align center*/
        }

        .right ul {
            display: flex;
            gap: 35px;
        }

        .right ul li {
            list-style: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .right ul li span {
            padding: 0px 5px;
        }

        ul li img {
            width: 70px;
            border-radius: 200px;
        }
    </style>
</head>
